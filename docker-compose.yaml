version: "3.9"

services:
    web:
        build: .
        container_name: drf_web
        command: >
            sh -c "
                python manage.py migrate &&
                python manage.py runserver 0.0.0.0:8000
            "
        ports:
            - "8000:8000"
        volumes:
            - .:/app
        env_file:
            - .env
        depends_on:
            - db
            - redis

    celery:
        build: .
        container_name: drf_celery
        command: celery -A config worker -l info
        volumes:
            - .:/app
        env_file:
            - .env
        depends_on:
            - web
            - redis

    beat:
        build: .
        container_name: drf_celery_beat
        command: celery -A config beat -l info
        volumes:
            - .:/app
        env_file:
            - .env
        depends_on:
            - web
            - redis

    redis:
      image: redis:7
      container_name: drf_redis
      restart: always
      ports:
          - "6379:6379"

    db:
        image: postgres:16
        container_name: drf_postgres
        restart: always
        env_file:
            - .env
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:
